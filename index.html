<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Палітра Кольорів</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-a: #eef3e8;
      --bg-b: #dde6d6;
      --panel: #f9fcf7;
      --panel-border: #d8e2d1;
      --text-main: #1e2a1a;
      --text-soft: #4c5d43;
      --accent: #3f7a4f;
      --card-shadow: 0 12px 24px rgba(19, 33, 16, 0.08);
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Space Grotesk", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 10% 12%, rgba(255, 255, 255, 0.65) 0 180px, transparent 220px),
        radial-gradient(circle at 92% 85%, rgba(255, 255, 255, 0.55) 0 200px, transparent 250px),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
    }

    .layout {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 2fr) 5fr;
      gap: 18px;
      padding: 18px;
    }

    .panel {
      background: rgba(249, 252, 247, 0.92);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(4px);
    }

    .input-panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .title {
      margin: 0;
      font-size: clamp(1.1rem, 1.2vw + 0.9rem, 1.55rem);
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin: 8px 0 16px;
      color: var(--text-soft);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      height: 100%;
      border-radius: var(--radius-md);
      border: 1px solid #c8d6bf;
      padding: 14px;
      resize: none;
      font: 500 0.93rem/1.5 "Space Grotesk", sans-serif;
      color: #1c2a1c;
      background: #fdfefc;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #6ca27a;
      box-shadow: 0 0 0 3px rgba(108, 162, 122, 0.2);
    }

    .footer {
      margin-top: 12px;
      font-size: 0.86rem;
      color: var(--text-soft);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .board {
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .board-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 14px;
    }

    .count {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(84, 148, 101, 0.14);
    }

    .grid-scroll {
      min-height: 0;
      overflow-y: auto;
      padding-right: 6px;
    }

    .grid-scroll::-webkit-scrollbar {
      width: 10px;
    }

    .grid-scroll::-webkit-scrollbar-thumb {
      background: #bed0b5;
      border-radius: 999px;
      border: 2px solid #eaf1e5;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      padding-bottom: 8px;
    }

    .swatch {
      border-radius: 18px;
      background: #f4f8f1;
      border: 1px solid #dbe7d5;
      padding: 11px;
      animation: card-in 320ms ease both;
      animation-delay: var(--delay, 0ms);
    }

    .swatch-square {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 15px;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.35),
        0 6px 14px rgba(20, 34, 16, 0.16);
    }

    .swatch-title {
      margin: 10px 0 4px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #223022;
      line-height: 1.3;
    }

    .swatch-hex {
      margin: 0;
      font-size: 0.82rem;
      color: #5f6f57;
    }

    .section-divider {
      grid-column: 1 / -1;
      margin: 2px 0 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #385236;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.82rem;
    }

    .section-divider::before,
    .section-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(106, 135, 95, 0.2), rgba(106, 135, 95, 0.65), rgba(106, 135, 95, 0.2));
    }

    .empty {
      grid-column: 1 / -1;
      border-radius: var(--radius-md);
      border: 1px dashed #bacab1;
      color: #536350;
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.48);
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(260px, 38vh) 1fr;
      }

      .color-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .layout {
        padding: 12px;
        gap: 12px;
      }

      .input-panel,
      .board {
        padding: 14px;
      }

      .color-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <section class="panel input-panel">
      <h1 class="title">Ввід кольорів</h1>
      <p class="subtitle">Формат кольору: <code>"#HEX":"Заголовок";</code>. Звичайний текст без <code>:</code> стане роздільником (наприклад, <code>LIGHT THEME</code>).</p>
      <textarea id="source" spellcheck="false" aria-label="Поле введення кольорів"></textarea>
      <div class="footer">
        <span id="valid-count">Розпізнано: 0</span>
        <span id="invalid-count">Пропущено: 0</span>
      </div>
    </section>

    <section class="panel board">
      <div class="board-top">
        <h2 class="title">Палітра</h2>
        <span class="count" id="badge">0 кольорів</span>
      </div>
      <div class="grid-scroll">
        <div id="grid" class="color-grid"></div>
      </div>
    </section>
  </main>

  <script>
    const source = document.getElementById("source");
    const grid = document.getElementById("grid");
    const badge = document.getElementById("badge");
    const validCount = document.getElementById("valid-count");
    const invalidCount = document.getElementById("invalid-count");

    const starter = [
      "LIGHT THEME",
      "\"#E76F51\":\"Теплий корал\";",
      "\"#2A9D8F\":\"Морська хвиля\";",
      "\"#E9C46A\":\"Піщаний жовтий\";",
      "\"#264653\":\"Темний океан\";",
      "DARK THEME",
      "\"#90BE6D\":\"Свіжа зелень\";",
      "\"#F4A261\":\"М'який апельсин\";",
      "\"#457B9D\":\"Тихий синій\";",
      "\"#A8DADC\":\"Легкий лід\";"
    ].join("\n");

    source.value = starter;

    function normalizeHex(raw) {
      const clean = raw.trim();
      const match = clean.match(/^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/);
      if (!match) {
        return null;
      }
      return "#" + match[1].toUpperCase();
    }

    function getSectionTitle(row) {
      if (row.includes(":")) {
        return null;
      }

      const quoted = row.match(/^"([^"]+)"$/);
      const clean = quoted ? quoted[1].trim() : row.trim();
      return clean || null;
    }

    function parseRows(input) {
      const rows = input
        .split("\n")
        .flatMap((line) => line.split(";").map((part) => part.trim()))
        .filter(Boolean);

      const entries = [];
      let colors = 0;
      let bad = 0;

      for (const row of rows) {
        const match = row.match(/^"([^"]+)"\s*:\s*"([^"]+)"$/);
        if (match) {
          const hex = normalizeHex(match[1]);
          if (!hex) {
            bad += 1;
            continue;
          }

          entries.push({
            type: "color",
            hex,
            title: match[2].trim()
          });
          colors += 1;
          continue;
        }

        if (normalizeHex(row)) {
          bad += 1;
          continue;
        }

        const sectionTitle = getSectionTitle(row);
        if (sectionTitle) {
          entries.push({
            type: "section",
            title: sectionTitle
          });
          continue;
        }

        bad += 1;
      }

      return { entries, colors, bad };
    }

    function renderPalette() {
      const { entries, colors, bad } = parseRows(source.value);
      const hasColors = entries.some((item) => item.type === "color");

      validCount.textContent = `Розпізнано: ${colors}`;
      invalidCount.textContent = `Пропущено: ${bad}`;
      badge.textContent = `${colors} ${colors === 1 ? "колір" : "кольорів"}`;

      if (!hasColors) {
        grid.innerHTML = "<div class=\"empty\">Немає валідних записів. Дотримуйтесь формату: \"#HEX\":\"Назва\";</div>";
        return;
      }

      let colorIndex = 0;
      grid.innerHTML = entries
        .map((item) => {
          if (item.type === "section") {
            return `<div class="section-divider">${escapeHtml(item.title)}</div>`;
          }

          colorIndex += 1;
          return `
            <article class="swatch" style="--delay:${Math.min((colorIndex - 1) * 32, 300)}ms">
              <div class="swatch-square" style="background:${item.hex}"></div>
              <p class="swatch-title">${escapeHtml(item.title)}</p>
              <p class="swatch-hex">${item.hex}</p>
            </article>
          `;
        })
        .join("");
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    source.addEventListener("input", renderPalette);
    renderPalette();
  </script>
</body>
</html>
